# --- Lean build config -------------------------------------------------
# This machine has repeatedly OOM'd with Gradle's defaults, which fork a
# Gradle daemon plus a separate Kotlin daemon, and run a native file-watcher
# thread that itself threw OutOfMemoryError. The settings below collapse the
# build into a single JVM and disable the non-essential background services.

# Run the Kotlin compiler inside the Gradle daemon instead of forking a
# second multi-GB process.
kotlin.compiler.execution.strategy=in-process

# Sized for a 16GB machine that also runs a browser and the IDE.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# The native file watcher caused OOM; polling is slower but reliable.
org.gradle.vfs.watch=false

# Parallel workers multiply peak memory. Sequential is safer here.
org.gradle.parallel=false
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
